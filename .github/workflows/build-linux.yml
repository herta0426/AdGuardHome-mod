name: Lint, test, and build Linux binaries

# Lints and tests the mod, then builds the Linux archives.
#
# Artifacts:
#
#   dist/AdGuardHome_linux_amd64.tar.gz  — x86_64
#   dist/AdGuardHome_linux_arm64.tar.gz  — arm64
#
# Run it manually from the Actions tab, or push a tag such as v2026-09-23 to
# also publish a GitHub release with the archives attached.  See
# scripts/make/version.sh for the version format.
#
# NOTE: The frontend is embedded into the Go binary, so it is built first.
# Only the classic frontend (client/) is built; the mod does not ship the
# next-generation one.

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Publishing a release requires a writable GITHUB_TOKEN.
permissions:
  contents: write

# Cancel the builds of a branch as soon as a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build
  CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'development' }}
  CLIENT_DIR: client
  DIST_DIR: dist
  # The official Go module proxy is tried first, and the mainland-China mirror
  # is used as a fallback.
  GOPROXY: https://proxy.golang.org,https://goproxy.cn,direct
  # Uncomment the line below to use a mainland-China npm mirror.
  # NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
  # There is no GPG key in this repository, so the builds are not signed.
  SIGN: '0'

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Set to false to avoid GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Install the frontend dependencies
        run: make js-deps

      - name: Lint the frontend
        run: make js-lint

      - name: Typecheck the frontend
        run: make js-typecheck

      - name: Test the frontend
        run: make js-test

      - name: Check the backend for the Linux architectures
        run: make go-deps go-os-check

      - name: Print the module file diff
        run: |
          #!/bin/sh

          set -e -f -u

          go mod tidy
          git --no-pager diff --stat go.mod go.sum
          git --no-pager diff go.mod

      - name: Test the backend
        run: go test ./...

  build-linux:
    name: Linux amd64 and arm64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The version script needs all the branches and tags.
          fetch-depth: 0
          # Set to false to avoid GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Set the build version
        id: version
        run: |
          #!/bin/sh

          set -e -f -u

          source_date_epoch="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=${source_date_epoch}" >> "$GITHUB_ENV"

          app_version="$(env CHANNEL="${CHANNEL}" sh ./scripts/make/version.sh)"
          echo "APP_VERSION=${app_version}" >> "$GITHUB_ENV"
          echo "version=${app_version}" >> "$GITHUB_OUTPUT"

          printf 'Building version %s (channel %s)\n' "${app_version}" "${CHANNEL}"

      - name: Install the frontend dependencies
        run: make js-deps

      - name: Build the frontend
        run: make js-build VERBOSE=1

      - name: Build the binaries
        run: |
          #!/bin/sh

          set -e -f -u

          make \
            ARCH="amd64 arm64" \
            CHANNEL="${CHANNEL}" \
            FRONTEND_PREBUILT=1 \
            OS="linux" \
            SIGN=0 \
            VERBOSE=1 \
            VERSION="${APP_VERSION}" \
            build-release \
            ;

      - name: Pack the release archives
        run: |
          #!/bin/sh

          set -e -f -u

          make \
            ARCH="amd64 arm64" \
            CHANNEL="${CHANNEL}" \
            OS="linux" \
            SHELL=/bin/bash \
            SIGN=0 \
            VERBOSE=1 \
            VERSION="${APP_VERSION}" \
            pack-release \
            ;

      - name: Upload the build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdGuardHome-linux
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/checksums.txt
            dist/AdGuardHome_linux_amd64.tar.gz
            dist/AdGuardHome_linux_arm64.tar.gz

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/checksums.txt
            dist/AdGuardHome_linux_amd64.tar.gz
            dist/AdGuardHome_linux_arm64.tar.gz
          generate_release_notes: true
